[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "theta-terminal-client"
version = "0.1.0"
description = "A small, dependable Python client for the Theta Terminal v3 local REST API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kaleb Hoffer" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
keywords = ["thetadata", "theta terminal", "options", "market data", "opra", "greeks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
  "Framework :: AsyncIO",
]

[project.optional-dependencies]
pandas = ["pandas>=2"]

[project.urls]
Homepage = "https://github.com/kalebhoffer/theta-terminal-client"
Issues = "https://github.com/kalebhoffer/theta-terminal-client/issues"
Changelog = "https://github.com/kalebhoffer/theta-terminal-client/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "pandas>=2", "pandas-stubs"]

[tool.hatch.build.targets.wheel]
packages = ["src/theta_terminal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
